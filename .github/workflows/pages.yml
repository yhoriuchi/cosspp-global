name: Validate and publish the public site
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      revision:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      publish:
        description: 'Deploy publicly (requires ENABLE_PAGES repository variable)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: pnpm test
      - name: Build for the public repository
        env:
          BASE_PATH: /cosspp-global/
        run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
        env:
          PLAYWRIGHT_BASE_PATH: /cosspp-global/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: ${{ inputs.publish && vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
