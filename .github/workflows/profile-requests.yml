name: Apply verified profile request
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Signed request UUID in the private queue'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: profile-request-promotion
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ vars.ENABLE_PROFILE_REQUESTS == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.save.outputs.revision }}
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx scripts/apply-profile-request.ts
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          QUEUE_REPOSITORY: ${{ vars.PROFILE_REQUEST_QUEUE }}
          QUEUE_READ_TOKEN: ${{ secrets.PROFILE_REQUEST_QUEUE_READ_TOKEN }}
          PROFILE_REQUEST_SIGNING_KEY: ${{ secrets.PROFILE_REQUEST_SIGNING_KEY }}
      - run: pnpm run validate
      - run: pnpm test
      - run: pnpm run build
        env:
          BASE_PATH: /cosspp-global/
      - id: save
        name: Save only validated public fields and receipt
        run: |
          git add -- data/public/faculty.json data/sources/inventory.json
          if [[ -d public/receipts ]]; then git add -- public/receipts; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply verified faculty research-summary request'
          git push origin HEAD:main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  publish:
    needs: apply
    if: ${{ needs.apply.outputs.changed == 'true' && vars.ENABLE_PAGES == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      publish: true
      revision: ${{ needs.apply.outputs.revision }}
